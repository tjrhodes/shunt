# nginx passes everything for the subdomain to the shunt server on its
# local port: the page, and the WebSocket the races run over (which needs
# the Upgrade headers below). certbot adds the HTTPS part when it runs.

server {
	listen 80;
	listen [::]:80;
	server_name shunt.tomrhodes.it;

	location / {
		proxy_pass http://127.0.0.1:2567;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
	}
}
