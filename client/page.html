<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@700;800;900&display=swap">
<style>
  /* Layout: the track fills the screen; small HUD plates sit in its top
     corners like a TV race graphic; panels float over a dimmed track.
     One look on purpose: a night race under floodlights. */
  :root {
    --night: #151a2b;          /* matches the 3D sky (view/Paint.hx): the portfolio's rock palette */
    --plate: rgba(21, 26, 43, 0.84);
    --plate-edge: rgba(219, 210, 185, 0.18);
    --ink: #f6f2e8;
    --ink-quiet: #a89775;
    --lamp-off: #293b5f;
    --lamp-red: #e0461a;
    --lamp-green: #36d06a;
    --player: #e9c93a;         /* replaced at start-up from view/Paint.hx */
    --display: "Fira Sans Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", "Helvetica Neue", Arial, sans-serif;
    --gutter-left: max(16px, env(safe-area-inset-left, 0px));
    --gutter-right: max(16px, env(safe-area-inset-right, 0px));
    --edge-top: calc(12px + env(safe-area-inset-top, 0px));
    --edge-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    --brake-bar: 64px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  /* Phones flash a box over whatever is tapped (the whole card ring, the stage): not in a game. Focus outlines still show for keys. */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
  }
  /* One plate per person, a corner each in seat order; the lap times take the top right when one races alone. */
  #hud > .plate { position: absolute; }
  .plate[data-corner="0"] { top: var(--edge-top); left: var(--gutter-left); }
  .plate[data-corner="1"], .plate-times { top: var(--edge-top); right: var(--gutter-right); }
  .plate[data-corner="2"] { bottom: var(--edge-bottom); left: var(--gutter-left); }
  .plate[data-corner="3"] { bottom: var(--edge-bottom); right: var(--gutter-right); }
  .plate-tag { align-self: center; font: 800 26px/1 var(--display); color: var(--player); }
  .plate {
    display: flex; gap: 18px; padding: 8px 14px 10px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .plate-standing { border-left: 4px solid var(--player); }
  .figure { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .figure-label {
    font: 600 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-quiet);
  }
  .figure-value {
    font: 900 28px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  .plate-times .figure-value { font-size: 22px; min-width: 3.4ch; }

  .damage-outline { width: 18px; height: 32px; align-self: center; }
  .damage-body { fill: none; stroke: var(--ink-quiet); stroke-width: 1; }
  .damage-zone { fill: color-mix(in srgb, var(--lamp-red) calc(var(--harm, 0) * 100%), var(--plate-edge)); }

  .lights {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    display: flex; gap: 10px; padding: 10px 14px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 30px;
    transition: opacity 400ms ease;
  }
  .lights.is-out { opacity: 0; }
  .lamp { width: 26px; height: 26px; border-radius: 50%; background: var(--lamp-off); }
  .lamp.is-red { background: var(--lamp-red); box-shadow: 0 0 18px var(--lamp-red); }
  .lamp.is-green { background: var(--lamp-green); box-shadow: 0 0 18px var(--lamp-green); }

  #panels {
    position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: safe center; pointer-events: none;  /* one column, never wider than the screen, whatever is inside */
    padding: 16px var(--gutter-right) 16px var(--gutter-left);
    overflow-y: auto; overscroll-behavior: contain;  /* a short screen scrolls the panel instead of cutting it off */
    transition: background 200ms ease;
  }
  #panels.is-showing { background: rgba(8, 10, 13, 0.55); pointer-events: auto; }
  .panel {
    box-sizing: border-box; width: min(100%, 30rem); padding: 26px 26px 24px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-top: 4px solid var(--player); border-radius: 3px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel-title {
    margin: 0; font: 900 clamp(40px, 9vw, 64px)/0.9 var(--display); letter-spacing: -0.01em; text-wrap: balance;
  }
  .panel-invite .panel-title { font-size: clamp(64px, 16vw, 104px); }
  .panel-tagline { margin: 0 0 6px; font: 500 18px/1.35 var(--body); }
  .panel-help { margin: 0; font: 400 14px/1.45 var(--body); color: var(--ink-quiet); max-width: 60ch; }
  .button {
    margin-top: 6px; padding: 12px 18px; cursor: pointer;
    font: 800 20px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .button-go { margin-top: 14px; color: #151a2b; background: var(--player); border-color: var(--player); }
  .button:hover { filter: brightness(1.1); }
  .button:focus-visible, #brake-pad:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Twelve tracks: three to a row, compact, name over laps. */
  /* The online room's track: one line, its little map, name, and laps; the host changes it on the cards. */
  .room-track {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 12px; background: #293b5f; border: 1px solid #465d8c; border-radius: 3px;
  }
  .room-track-what { flex: 1 1 12rem; display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 14px; align-items: center; }
  .room-track .button { margin-top: 0; padding: 10px 14px; font-size: 17px; }
  .room-track .track-card-map { grid-row: 1 / 3; width: 64px; height: 64px; margin: 0; }
  .room-track .track-card-map path { stroke: #e9c93a; }
  .room-track-name { align-self: end; font: 900 26px/1 var(--display); }
  .room-track-laps { align-self: start; font: 500 14px/1.4 var(--body); color: var(--ink-quiet); }
  .panel-room > .button:not(.button-go) { align-self: flex-start; }

  .seat-picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .seat {
    display: flex; flex-direction: column; gap: 4px; padding: 9px 10px 10px;
    border: 1px solid var(--plate-edge); border-top: 3px solid var(--player); border-radius: 3px;
    color: var(--ink-quiet);
  }
  .seat.is-human { color: var(--ink); background: color-mix(in srgb, var(--player) 14%, transparent); }
  .seat-who { font: 800 19px/1 var(--display); letter-spacing: 0.02em; }
  .seat.is-human .seat-who { color: var(--player); }
  .seat-how { min-height: 1em; font: 500 13px/1.2 var(--body); }

  .seat.is-ours { box-shadow: inset 0 0 0 1px var(--player); }

  .online-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--plate-edge); }
  .panel-subtitle { margin: 0; font: 800 26px/1 var(--display); letter-spacing: 0.01em; }
  .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .button-row .button { flex: 1 1 10rem; margin-top: 0; }
  .room-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .room-link .panel-help { grid-column: 1 / -1; }
  .room-link-text {
    overflow-wrap: anywhere; user-select: all; padding: 10px 12px;
    font: 500 14px/1.3 ui-monospace, monospace; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .room-link .button { margin-top: 0; }
  .room-reason { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  /* Connecting, or a problem: just the words and the way out. */
  .panel-room.is-just-words > :not(.panel-title):not(.panel-tagline):not(.room-reason):not(.button:last-child) { display: none; }

  /* While starting a race, the HUD steps aside: one thing on screen at a time. */
  #hud { transition: opacity 200ms ease; }
  body.is-starting #hud { opacity: 0; }

  /* Out of sight, but there for screen readers and keyboards. */
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The ring of track cards, drawn in 3D (view/CardRing.hx). */
  .card-ring { display: block; width: calc(100% + 52px); margin: 0 -26px; height: clamp(260px, 46vh, 420px); cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; }  /* sideways swipes are ours; up and down still scroll the panel */

  /* The first stage: a carousel of track cards, the chosen one in the middle (it slides there). */
  .panel-tracks { width: min(100%, 64rem); }
  .track-cards {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    padding: 10px calc(50% - 7rem) 16px; margin: 0 -26px;
  }
  .track-cards::-webkit-scrollbar { display: none; }
  .track-card {
    flex: 0 0 14rem; scroll-snap-align: center; display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 16px;
    color: var(--ink); text-align: left; cursor: pointer; background: rgba(41, 59, 95, 0.45);
    border: 1px solid var(--plate-edge); border-radius: 3px; opacity: 0.55; transform: scale(0.93);
    transition: opacity 200ms ease, transform 200ms ease, border-color 200ms ease;
  }
  .track-card:hover { opacity: 0.8; }
  .track-card[aria-selected="true"] { opacity: 1; transform: none; border-color: var(--player); box-shadow: inset 0 0 0 1px var(--player); }
  .track-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .track-card-map { width: 100%; aspect-ratio: 1; margin-bottom: 8px; }
  .track-card-map path { fill: none; stroke: var(--ink-quiet); stroke-linecap: round; stroke-linejoin: round; }
  .track-card[aria-selected="true"] .track-card-map path { stroke: var(--player); }
  .track-card-name { font: 900 28px/1 var(--display); letter-spacing: 0.01em; }
  .track-card-family { font: 600 11px/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-quiet); }
  .track-card-laps { font: 500 14px/1.3 var(--body); color: var(--ink-quiet); }
  .panel-tracks > .button-go { align-self: center; min-width: 16rem; }

  /* The second stage: the drivers. Back and Start side by side. */
  .panel-drivers .button-row { margin-top: 10px; }
  .panel-drivers .button-row .button { margin-top: 0; }
  .panel-drivers .button-row .button-go { flex: 2 1 12rem; }

  .results { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
  .result {
    display: grid; grid-template-columns: 3.2ch 14px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 9px 4px; border-bottom: 1px solid var(--plate-edge);
    font: 500 17px/1 var(--body); font-variant-numeric: tabular-nums;
  }
  .result.is-player { color: var(--player); font-weight: 600; }
  /* The winner's row stands out: bigger, on the lichen yellow of a trophy. */
  .result:first-child { padding: 14px 10px; font-size: 21px; background: rgba(233, 201, 58, 0.1); border-bottom-color: #e9c93a; }
  .result:first-child .result-place, .result:first-child .result-time { font-size: 26px; color: #e9c93a; }
  .panel-results { width: min(100%, 34rem); }
  .panel-results .panel-title { color: #e9c93a; }
  .panel-pause { width: min(100%, 22rem); }
  .result-place { font: 800 20px/1 var(--display); }
  .result-swatch { width: 14px; height: 14px; border-radius: 2px; }
  .result-time { font: 800 19px/1 var(--display); }

  /* Brake by touch: a bar right across the bottom (Tom, 3 Nov), so either thumb can reach it, even while the other steers right. */
  #brake-pad {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--brake-bar) + env(safe-area-inset-bottom, 0px));
    padding: 0 0 env(safe-area-inset-bottom, 0px); border-radius: 0;
    font: 800 20px/1 var(--display); letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--ink); background: var(--plate); border: 0; border-top: 2px solid var(--lamp-red);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #brake-pad:active { background: var(--lamp-red); }
  /* The touch buttons are for racing: out of the way while a panel shows. */
  #panels.is-showing ~ #brake-pad, #panels.is-showing ~ #pause-button { visibility: hidden; }
  /* While the brake bar shows, everything along the bottom sits above it. */
  :root:has(#brake-pad:not([hidden])) { --edge-bottom: calc(var(--brake-bar) + 12px + env(safe-area-inset-bottom, 0px)); }
  #pause-button {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px)); padding: 9px 14px;
    font: 800 15px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 3px;
  }

  @media (max-width: 480px) {
    .seat-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .track-card { flex-basis: 12rem; }
    .track-cards { padding-left: calc(50% - 6rem); padding-right: calc(50% - 6rem); }
    .plate { gap: 12px; padding: 6px 10px 8px; }
    .figure-value { font-size: 22px; }
    .plate-times .figure-value { font-size: 17px; }
    .lights { top: auto; bottom: calc(var(--edge-bottom) + 6px); }
    #pause-button { top: calc(76px + env(safe-area-inset-top, 0px)); }
    .lamp { width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lights, #panels, .track-card { transition: none; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="The race track"></div>
<div id="hud" aria-live="off"></div>
<div id="panels"></div>
<button id="brake-pad" type="button" hidden></button>
<button id="pause-button" type="button" hidden></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shunt.js" charset="utf-8"></script>
</body>
</html>
