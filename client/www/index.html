<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@600;800&display=swap">
<style>
  /* Layout: the track fills the screen; small HUD plates sit in its top
     corners like a TV race graphic; panels float over a dimmed track.
     One look on purpose: a night race under floodlights. */
  :root {
    --night: #101318;          /* matches the 3D sky (view/Paint.hx) */
    --plate: rgba(12, 14, 18, 0.78);
    --plate-edge: rgba(255, 244, 224, 0.14);
    --ink: #f1efe8;
    --ink-quiet: #a9a8a1;
    --lamp-off: #2a2d33;
    --lamp-red: #e5402f;
    --lamp-green: #36d06a;
    --player: #f2b134;         /* replaced at start-up from view/Paint.hx */
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --gutter-left: max(16px, env(safe-area-inset-left, 0px));
    --gutter-right: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    --edge-top: calc(12px + env(safe-area-inset-top, 0px));
    --edge-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  /* One plate per person, a corner each in seat order; the lap times take the top right when one races alone. */
  #hud > .plate { position: absolute; }
  .plate[data-corner="0"] { top: var(--edge-top); left: var(--gutter-left); }
  .plate[data-corner="1"], .plate-times { top: var(--edge-top); right: var(--gutter-right); }
  .plate[data-corner="2"] { bottom: var(--edge-bottom); left: var(--gutter-left); }
  .plate[data-corner="3"] { bottom: var(--edge-bottom); right: var(--gutter-right); }
  .plate-tag { align-self: center; font: 800 26px/1 var(--display); color: var(--player); }
  .plate {
    display: flex; gap: 18px; padding: 8px 14px 10px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .plate-standing { border-left: 4px solid var(--player); }
  .figure { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .figure-label {
    font: 600 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-quiet);
  }
  .figure-value {
    font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  .plate-times .figure-value { font-size: 22px; min-width: 3.4ch; }

  .damage-outline { width: 18px; height: 32px; align-self: center; }
  .damage-body { fill: none; stroke: var(--ink-quiet); stroke-width: 1; }
  .damage-zone { fill: color-mix(in srgb, var(--lamp-red) calc(var(--harm, 0) * 100%), var(--plate-edge)); }

  .lights {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    display: flex; gap: 10px; padding: 10px 14px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 30px;
    transition: opacity 400ms ease;
  }
  .lights.is-out { opacity: 0; }
  .lamp { width: 26px; height: 26px; border-radius: 50%; background: var(--lamp-off); }
  .lamp.is-red { background: var(--lamp-red); box-shadow: 0 0 18px var(--lamp-red); }
  .lamp.is-green { background: var(--lamp-green); box-shadow: 0 0 18px var(--lamp-green); }

  #panels {
    position: fixed; inset: 0; display: grid; place-items: safe center; pointer-events: none;
    padding: 16px var(--gutter-right) 16px var(--gutter-left);
    overflow-y: auto; overscroll-behavior: contain;  /* a short screen scrolls the panel instead of cutting it off */
    transition: background 200ms ease;
  }
  #panels.is-showing { background: rgba(8, 10, 13, 0.55); pointer-events: auto; }
  .panel {
    box-sizing: border-box; width: min(100%, 30rem); padding: 26px 26px 24px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-top: 4px solid var(--player); border-radius: 3px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel-title {
    margin: 0; font: 800 clamp(40px, 9vw, 64px)/0.9 var(--display); letter-spacing: -0.01em; text-wrap: balance;
  }
  .panel-start .panel-title { font-size: clamp(64px, 16vw, 104px); }
  .panel-tagline { margin: 0 0 6px; font: 500 18px/1.35 var(--body); }
  .panel-help { margin: 0; font: 400 14px/1.45 var(--body); color: var(--ink-quiet); max-width: 60ch; }
  .button {
    margin-top: 6px; padding: 12px 18px; cursor: pointer;
    font: 800 20px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .button-go { margin-top: 14px; color: #14110a; background: var(--player); border-color: var(--player); }
  .button:hover { filter: brightness(1.1); }
  .button:focus-visible, #brake-pad:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .track-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .track-choice { margin-top: 0; flex: 1 1 10rem; font-size: 17px; text-transform: none; letter-spacing: 0.02em; }
  .track-choice[aria-pressed="true"] { border-color: var(--player); color: var(--player); box-shadow: inset 0 0 0 1px var(--player); }

  .seat-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: 8px; margin-top: 8px; }
  .seat {
    display: flex; flex-direction: column; gap: 4px; padding: 9px 10px 10px;
    border: 1px solid var(--plate-edge); border-top: 3px solid var(--player); border-radius: 3px;
    color: var(--ink-quiet);
  }
  .seat.is-human { color: var(--ink); background: color-mix(in srgb, var(--player) 14%, transparent); }
  .seat-who { font: 800 19px/1 var(--display); letter-spacing: 0.02em; }
  .seat.is-human .seat-who { color: var(--player); }
  .seat-how { min-height: 1em; font: 500 13px/1.2 var(--body); }

  .seat.is-ours { box-shadow: inset 0 0 0 1px var(--player); }
  .track-choice[disabled] { cursor: default; opacity: 0.55; filter: none; }
  .track-choice[disabled][aria-pressed="true"] { opacity: 1; }

  .online-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--plate-edge); }
  .panel-subtitle { margin: 0; font: 800 26px/1 var(--display); letter-spacing: 0.01em; }
  .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .button-row .button { flex: 1 1 10rem; margin-top: 0; }
  .online-choices .button-join { margin-top: 4px; }
  /* Opened from a friend's link: joining them comes first, and racing alone is a quiet second choice. */
  .panel-start:not(.is-invited) .only-invited,
  .panel-start.is-invited .not-invited,
  .panel-start.is-invited > .track-picker,
  .panel-start.is-invited > .button-start,
  .panel-start.is-invited > .seat-picker,
  .panel-start.is-invited > .seat-picker + .panel-help { display: none; }
  .panel-start.is-invited > .online-choices { order: -1; margin-top: 0; padding-top: 0; border-top: 0; }
  .panel-start.is-invited > .panel-title, .panel-start.is-invited > .panel-tagline { order: -2; }
  .room-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .room-link .panel-help { grid-column: 1 / -1; }
  .room-link-text {
    overflow-wrap: anywhere; user-select: all; padding: 10px 12px;
    font: 500 14px/1.3 ui-monospace, monospace; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--plate-edge); border-radius: 3px;
  }
  .room-link .button { margin-top: 0; }
  .room-reason { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  /* Connecting, or a problem: just the words and the way out. */
  .panel-room.is-just-words > :not(.panel-title):not(.panel-tagline):not(.room-reason):not(.button:last-child) { display: none; }

  .results { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
  .result {
    display: grid; grid-template-columns: 3.2ch 14px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 9px 4px; border-bottom: 1px solid var(--plate-edge);
    font: 500 17px/1 var(--body); font-variant-numeric: tabular-nums;
  }
  .result.is-player { color: var(--player); font-weight: 600; }
  .result-place { font: 800 20px/1 var(--display); }
  .result-swatch { width: 14px; height: 14px; border-radius: 2px; }
  .result-time { font: 800 19px/1 var(--display); }

  #brake-pad {
    position: fixed; width: 96px; height: 96px; border-radius: 50%;
    right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font: 800 18px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: var(--plate); border: 2px solid var(--lamp-red);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #brake-pad:active { background: var(--lamp-red); }
  #pause-button {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px)); padding: 9px 14px;
    font: 800 15px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 3px;
  }

  @media (max-width: 480px) {
    .plate { gap: 12px; padding: 6px 10px 8px; }
    .figure-value { font-size: 22px; }
    .plate-times .figure-value { font-size: 17px; }
    .lights { top: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    #pause-button { top: calc(76px + env(safe-area-inset-top, 0px)); }
    .lamp { width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lights, #panels { transition: none; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="The race track"></div>
<div id="hud" aria-live="off"></div>
<div id="panels"></div>
<button id="brake-pad" type="button" hidden></button>
<button id="pause-button" type="button" hidden></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shunt-e36b8c42.js" charset="utf-8"></script>
</body>
</html>
